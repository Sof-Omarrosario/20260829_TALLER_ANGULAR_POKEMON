

    <div>
        <header id="cabecera-principal">
            <h1 id="titulo-principal">FORMULARIO</h1>
        </header>
    </div>

    <main id="contenido-principal">


        <div>
            <form id="formulario-registro" (ngSubmit)="guardarUsuario()">


                <div id="grupo-nombre" class="form-group">
                    <label id="label-nombre" for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
                </div>

                <div id="grupo-apellido" class="form-group">
                    <label id="label-apellido" for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Apellidos" required>
                </div>

                <div id="grupo-tipo-identificacion" class="form-group">
                    <label id="label-tipo-identificacion" for="tipo_identificacion">
                        Tipo de identificación:
                    </label>

                    <select id="tipo_identificacion" name="tipo_identificacion" required>
                        <option value="" disabled selected>Seleccione...</option>
                        <option id="opcion-cc" value="13">Cédula de ciudadanía</option>
                        <option id="opcion-ti" value="12">Tarjeta de identidad</option>
                        <option id="opcion-ce" value="21">Cédula de extranjería</option>
                        <option id="opcion-pe" value="41">Pasaporte</option>
                    </select>
                </div>

                <div id="grupo-num-identificacion" class="form-group">
                    <label id="label-num-identificacion" for="numero_identificacion">
                        Número de identificación:
                    </label>

                    <input
                        type="text"
                        id="numero_identificacion"
                        name="numero_identificacion"
                        placeholder="Su número de identificación"
                        required
                    >
                </div>

                <div id="grupo-nacimiento" class="form-group">
                    <label id="label-nacimiento" for="nacimiento">
                        Fecha de Nacimiento:
                    </label>

                    <input type="date" id="nacimiento" name="nacimiento" required>
                </div>

                <!-- CAMPO PARA RETOS 1, 2 Y 3 -->
                <div id="grupo-edad" class="form-group">
                    <label id="label-edad" for="edad">Edad:</label>
                    <input
                        type="number"
                        id="edad"
                        name="edad"
                        placeholder="Ingrese su edad"
                        min="0"
                        required
                    >
                </div>

                <!-- CAMPOS PARA RETO 4 -->
                <div id="grupo-valor" class="form-group">
                    <label id="label-valor" for="valor">Valor:</label>
                    <input
                        type="number"
                        id="valor"
                        name="valor"
                        placeholder="Ingrese un valor"
                        required
                    >
                </div>

                <div id="grupo-minimo" class="form-group">
                    <label id="label-minimo" for="minimo">Mínimo:</label>
                    <input
                        type="number"
                        id="minimo"
                        name="minimo"
                        placeholder="Ingrese el mínimo"
                        required
                    >
                </div>

                <div id="grupo-celular" class="form-group">
                    <label id="label-celular" for="celular">
                        Número de celular:
                    </label>

                    <input
                        type="tel"
                        id="celular"
                        name="celular"
                        placeholder="Su número de celular"
                        required
                    >
                </div>

                <div id="grupo-correo" class="form-group">
                    <label id="label-correo" for="correo">
                        Correo electrónico:
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Su correo electrónico"
                        required
                    >
                </div>

                <div id="grupo-pais" class="form-group">
                    <label id="label-pais" for="pais">
                        País de domicilio:
                    </label>

                    <select id="pais" name="pais" required>
                        <option value="" disabled>Seleccione un país...</option>
                        <option value="169" selected>Colombia</option>
                        <option value="249">Estados Unidos</option>
                        <option value="245">España</option>
                    </select>
                </div>

                <div id="grupo-ciudad" class="form-group">
                    <label id="label-ciudad" for="ciudad">
                        Ciudad de domicilio:
                    </label>

                    <select id="ciudad" name="ciudad" required>
                        <option value="" disabled selected>
                            Seleccione una ciudad...
                        </option>

                        <optgroup label="Colombia">
                            <option value="11001">Bogotá, D.C.</option>
                            <option value="05001">Medellín</option>
                            <option value="76001">Cali</option>
                            <option value="08001">Barranquilla</option>
                            <option value="13001">Cartagena</option>
                        </optgroup>

                        <optgroup label="Estados Unidos">
                            <option value="US-NY">Nueva York</option>
                            <option value="US-MI">Miami</option>
                            <option value="US-LA">Los Ángeles</option>
                            <option value="US-CH">Chicago</option>
                            <option value="US-HO">Houston</option>
                        </optgroup>

                        <optgroup label="España">
                            <option value="ES-MA">Madrid</option>
                            <option value="ES-BA">Barcelona</option>
                            <option value="ES-VA">Valencia</option>
                            <option value="ES-SE">Sevilla</option>
                            <option value="ES-BI">Bilbao</option>
                        </optgroup>
                    </select>
                </div>

                <div id="grupo-tratamiento-datos" class="form-group">

                    <h4 id="titulo-tratamiento">
                        Tratamiento de datos personales
                    </h4>

                    <a
                        id="enlace-terminos"
                        href="https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=49981"
                        target="_blank"
                    >
                        Términos y condiciones
                    </a>

                    <div id="grupo-checkbox">
                        <input
                            type="checkbox"
                            id="tratamiento_datos"
                            name="tratamiento_datos"
                            required
                        >

                        <label id="label-tratamiento" for="tratamiento_datos">
                            Acepto el tratamiento de mis datos personales después
                            de haber leído los términos y condiciones
                        </label>
                    </div>

                </div>

                <div id="grupo-boton-enviar" class="form-group">
                    <button type="submit">Enviar</button>
                </div>

            </form>
        </div>


        @if (ultimoUsuario(); as user)
        <div class="user-info">
            <h3>Usuario Registrado</h3>
            
        </div>

    </main>
